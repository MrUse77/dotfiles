schema: spec-driven

context: |
  Tech stack: Go 1.26.5, Cobra
  Architecture: CLI application
  Testing: go test
  Style: standard Go conventions

testing:
  strict_tdd: true
  detected: "2026-07-12"
  runner:
    command: "go test ./..."
    framework: "go test"
  layers:
    unit:
      available: true
      tool: "go test"
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    command: "go test -cover ./..."
  quality:
    linter:
      available: true
      command: "go vet ./..."
    type_checker:
      available: true
      command: "go build ./..."
    formatter:
      available: true
      command: "go fmt ./..."

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./..."
    build_command: "go build ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
