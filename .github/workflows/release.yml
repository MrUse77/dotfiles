name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Validate SemVer tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Build binaries
        run: |
          cd cli
          mkdir -p dist
          for target in "linux amd64" "linux arm64"; do
            set -- $target
            GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags "-X github.com/MrUse77/dots-cli/cmd.Version=${GITHUB_REF_NAME}" \
              -o "dist/moonarch-cli-$1-$2" .
          done

      - name: Generate changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## Changelog"
            echo
            git log --no-merges --pretty=format:'- %s' "$RANGE" \
              | grep -E '^\- (feat|fix)' | head -50 || true
          } > /tmp/changelog.md

      - name: Generate checksums
        run: |
          cd cli/dist
          sha256sum moonarch-cli-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/changelog.md \
            cli/dist/moonarch-cli-* cli/dist/SHA256SUMS.txt
